baseURL = "https://fangjunzhou.github.io/"
locale = "en-US"
title = "Fangjun Zhou"
theme = "typo"

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$'], ['\[', '\]']]
inline = [['$', '$'], ['\(', '\)']]

[params]
# colorPalette = "catpuccin"
math = true
showFooter = false
homeCollection = "posts"
paginationSize = 100
listSummaries = true

[[params.social]]
name = "github"
title = "GitHub"
url = "https://github.com/fangjunzhou"

[[params.social]]
name = "linkedin"
title = "LinkedIn"
url = "https://www.linkedin.com/in/fangjun-zhou/"

[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts/"
